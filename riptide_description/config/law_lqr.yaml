# Law selector (passed to the ee_stabilization_controller spawner via
# --param-file). Selects the operational-space LQR control law. The cost weights
# live in riptide_controllers.yaml under `lqr.*` (see docs/control_theory.md 3).
ee_stabilization_controller:
  ros__parameters:
    control_law: riptide_control/TaskSpaceLqr
