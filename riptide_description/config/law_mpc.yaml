# Law selector (passed to the ee_stabilization_controller spawner via
# --param-file). Selects the operational-space MPC control law. The horizon,
# weights and input bounds live in riptide_controllers.yaml under `mpc.*`
# (see docs/control_theory.md 4).
ee_stabilization_controller:
  ros__parameters:
    control_law: riptide_control/TaskSpaceMpc
